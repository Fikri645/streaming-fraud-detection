# Local "Profile L" stack: Redpanda (Kafka-compatible) + Console + Redis.
# App services (simulator/processor/scorer/api) run via their own profiles so
# you can develop them on the host first:  docker compose up -d redpanda console redis
services:
  redpanda:
    image: redpandadata/redpanda:v24.3.6
    container_name: sfd-redpanda
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --memory 1G
    ports:
      - "19092:19092"   # Kafka API (host)
      - "18081:18081"   # schema registry
      - "18082:18082"   # HTTP proxy
      - "9644:9644"     # admin
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health", "--exit-when-healthy"]
      interval: 10s
      timeout: 5s
      retries: 10

  console:
    image: redpandadata/console:v2.8.2
    container_name: sfd-console
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8088:8080"   # 8080 is taken on this machine
    depends_on:
      redpanda:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: sfd-redis
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
